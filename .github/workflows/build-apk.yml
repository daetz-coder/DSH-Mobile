name: Build APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install app dependencies
        working-directory: app
        run: npm ci || npm install

      - name: Sync Capacitor android
        working-directory: app
        run: npx cap sync android

      - name: Restore release keystore from secrets
        working-directory: app/android
        run: |
          if [ -n "${{ secrets.KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > dsh-mobile-release.keystore
            cat > keystore.properties <<EOF
          storeFile=../dsh-mobile-release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_ALIAS }}
          keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          EOF
            echo "keystore restored and signing configured"
          else
            echo "KEYSTORE_B64 not set — release will fall back to debug signing"
          fi

      - name: Build release APK (signed or debug-fallback)
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Rename APK to DSH-Mobile.apk
        working-directory: app/android
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/DSH-Mobile.apk
          sha256sum dist/DSH-Mobile.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-apks
          path: app/android/dist/*.apk
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dsh-mobile-apks
          path: apks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apks/**/*.apk
          body_path: RELEASE_NOTES.md
          generate_release_notes: false